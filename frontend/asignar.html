<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SIXAT - Asignar chofer</title>
<link rel="stylesheet" href="css/styles.css?v=5">
<link rel="icon" type="image/png" href="img/Logo_pagina.png">
</head>
<body>
<div class="taxi-banner"></div>

<header class="dashboard-header">
    <div class="brand">SIXAT - Asignar chofer a carro</div>
    <nav class="main-nav">
        <a href="dashboard.html" class="nav-btn">Dashboard</a>
        <a href="carros.html" class="nav-btn">Carros</a>
        <a href="choferes.html" class="nav-btn">Choferes</a>
        <a href="asignar.html" class="nav-btn">Asignar</a>
        <a href="documentos.html" class="nav-btn">Documentos</a>
    </nav>
</header>

<div id="toast-container"></div>

<main class="dashboard-main">
    <form id="asignar-form">
        <div class="field">
            <label for="carro_id">Carro</label>
            <select id="carro_id" required></select>
        </div>
        <div class="field">
            <label for="chofer_id">Chofer</label>
            <select id="chofer_id" required></select>
        </div>
        <div class="field">
            <label for="fecha_inicio">Fecha de inicio</label>
            <input type="date" id="fecha_inicio" required>
        </div>

        <button type="submit" class="btn-primary">Asignar</button>
    </form>
</main>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/asignar.js"></script>
</body>
</html>
