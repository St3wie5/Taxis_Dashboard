<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SIXAT - Agregar Documento</title>
<link rel="stylesheet" href="css/styles.css?v=6">
<link rel="icon" type="image/png" href="img/Logo_pagina.png">
</head>
<body>
<div class="taxi-banner"></div>

<header class="dashboard-header">
    <div class="brand">SIXAT - Nuevo documento</div>
    <nav class="main-nav">
        <a href="dashboard.html" class="nav-btn">Dashboard</a>
        <a href="carros.html" class="nav-btn">Carros</a>
        <a href="choferes.html" class="nav-btn">Choferes</a>
        <a href="asignar.html" class="nav-btn">Asignar</a>
        <a href="documentos.html" class="nav-btn">Documentos</a>
        <button type="button" class="nav-btn" onclick="cerrarSesion()">Cerrar sesion</button>
    </nav>
</header>

<div id="toast-container"></div>

<main class="dashboard-main">
    <form id="documento-form">
        <div class="field">
            <label for="chofer_id">Chofer</label>
            <select id="chofer_id" required></select>
        </div>
        <div class="field">
            <label for="tipo_documento">Tipo de documento</label>
            <select id="tipo_documento" required>
                <option value="Licencia de conducir">Licencia de conducir</option>
                <option value="INE">INE</option>
                <option value="Tarjeta de circulacion">Tarjeta de circulación</option>
                <option value="Comprobante de domicilio">Comprobante de domicilio</option>
                <option value="Otro">Otro</option>
            </select>
        </div>
        <div class="field">
            <label for="archivo">Archivo (PDF o imagen)</label>
            <input type="file" id="archivo" accept=".pdf,image/*" required>
        </div>

        <button type="submit" class="btn-primary">Subir documento</button>
    </form>
</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/formulario-documento.js"></script>
</body>
</html>
