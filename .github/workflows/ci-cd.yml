name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pytest con cobertura (minimo 80%)
        run: pytest

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: backend/htmlcov/

  security:
    name: Analisis de seguridad (Bandit)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Generar reporte de Bandit
        if: always()
        run: bandit -r app.py -ll -f txt -o bandit-report.txt

      - name: Guardar reporte de Bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-seguridad-bandit
          path: backend/bandit-report.txt

      - name: Validar que no haya hallazgos
        run: bandit -r app.py -ll

  quality:
    name: Analisis de calidad de codigo (Pylint + Radon)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Generar reporte de Pylint
        if: always()
        run: pylint app.py --disable=C0114,C0116 > pylint-report.txt || true

      - name: Generar reporte de complejidad ciclomatica (Radon CC)
        if: always()
        run: radon cc app.py -a -s > radon-cc-report.txt

      - name: Generar reporte de indice de mantenibilidad (Radon MI)
        if: always()
        run: radon mi app.py -s > radon-mi-report.txt

      - name: Guardar reportes de calidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-calidad-codigo
          path: |
            backend/pylint-report.txt
            backend/radon-cc-report.txt
            backend/radon-mi-report.txt

  deploy:
    name: Deploy a Render
    runs-on: ubuntu-latest
    needs: [ test, security, quality ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Disparar deploy hook de Render
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL no esta configurado como secret. Se omite el deploy automatico."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
